<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEE 픽토그램 쇼</title>
<style>
:root{--ink:#1f2a6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;overflow:hidden;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#frame{position:relative;width:min(78vh,90vw);height:min(78vh,90vw)}
#frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden}
#frame img.on{visibility:visible}
#frame img.pop{animation:pop .2s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.55)}100%{transform:scale(1)}}
#title{font-size:5vh;font-weight:800;margin-top:1.5vh;min-height:6vh;text-align:center}
#num{position:fixed;right:3vh;bottom:2vh;font-size:3vh;font-weight:800;opacity:.5}
#bar{position:fixed;left:0;bottom:0;height:.8vh;background:var(--ink);width:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:var(--ink);color:#fff;text-align:center;z-index:5;padding:4vh}
#menu h1{font-size:7vh}#menu p{opacity:.8;font-size:2.2vh;line-height:1.7}
#menu button{font-size:4vh;font-weight:800;padding:2vh 7vh;border:0;border-radius:2vh;background:#fff;color:var(--ink);cursor:pointer}
#menu button:disabled{opacity:.4;cursor:wait}
#menu label{font-size:2.2vh}
#load{width:40vw;height:1vh;background:rgba(255,255,255,.25);border-radius:1vh;overflow:hidden}#load div{height:100%;width:0;background:#fff;transition:width .2s}
#paused{position:fixed;top:2vh;right:3vh;font-size:3vh;font-weight:800;display:none}
</style></head><body>
<div id="stage"><div id="frame"></div><div id="title"></div></div>
<div id="num"></div><div id="bar"></div><div id="flash"></div><div id="paused">⏸ 일시정지</div>
<div id="menu">
  <h1>BEE 픽토그램 쇼</h1>
  <p>요한복음: 일곱 표징 · '나는 ~이다' · 십자가 · 내 양을 먹이라<br><span id="info">불러오는 중…</span></p>
  <div id="load"><div></div></div>
  <label><input id="click" type="checkbox"> 찰칵 효과음 (음악에 이미 있으면 끄기)</label>
  <button id="go" disabled>불러오는 중…</button>
  <p>스페이스 = 일시정지 · → 다음 · ← 이전 · F = 전체화면 · M = 음소거 · Esc = 처음으로</p>
</div>
<audio id="bgm" preload="auto"></audio>
<script>
const S=__SLIDES__;
// Beat (seconds into the track) for each scene: 0:16 then every 4s ... 1:44, 1:48, then the short gap 1:50, 1:54.
const BEAT=S.map((_,k)=>16+4*k);
if(S.length===26){BEAT[24]=110;BEAT[25]=114;}
const LEAD=0.4;                 // show each pictogram this much before its beat (covers pop-in)
const AMEN=118, FADE_FROM=124, FADE_TO=140;   // 1:58 아멘 · 2:04 fade starts · 2:20 silent
const $=id=>document.getElementById(id), A=$('bgm'), F=$('frame');
// Preload + decode every image into its own <img>: a swap is instant and never shows an old/half-loaded picture.
const IMGS=[{src:'intro.jpg',t:'등장!'}].concat(S.map(s=>({src:'p/'+s.id+'.jpg',t:s.t})));
let loaded=0,audioOK=false;
const els=IMGS.map(o=>{const im=new Image();let c=false;const done=()=>{if(c)return;c=true;loaded++;prog();if(im.decode)im.decode().catch(()=>{})};
  im.onload=done;im.onerror=done;im.src=o.src;F.appendChild(im);if(im.complete)done();return im});
// Download the whole track first (blob), so playback never stalls mid-show.
fetch('bgm.mp3').then(r=>r.blob()).then(b=>{A.src=URL.createObjectURL(b);audioOK=true;prog()}).catch(()=>{audioOK=true;prog()});
setTimeout(()=>{if($('go').disabled){audioOK=true;loaded=IMGS.length;prog()}},20000); // safety: never stay stuck on loading
function prog(){const p=(loaded+(audioOK?1:0))/(IMGS.length+1);$('load').firstChild.style.width=(p*100)+'%';
  if(p>=1&&$('go').disabled){$('go').disabled=false;$('go').textContent='▶ 시작';
   $('info').textContent=S.length+'장면 · 첫 장면 0:16 · 4초마다 · 2:20 페이드아웃';}}
let cur=-99,ctx=null,raf=0;
function shutter(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const n=ctx.sampleRate*.09,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/n,3);const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=.6;s.buffer=b;s.connect(g).connect(ctx.destination);s.start();}catch(e){}
 const f=$('flash');f.style.transition='none';f.style.opacity=.85;requestAnimationFrame(()=>{f.style.transition='opacity .3s';f.style.opacity=0});}
// k = -1 intro (cast enters the stage), 0..n-1 scenes, n = 아멘
function show(k){cur=k;els.forEach(e=>e.classList.remove('on','pop'));
 if(k>=S.length){$('title').textContent='아멘 🙏';$('num').textContent='';$('bar').style.width='100%';return}
 const e=els[k+1];void e.offsetWidth;e.classList.add('on');if(k>=0)e.classList.add('pop');
 $('title').textContent=IMGS[k+1].t;$('num').textContent=k>=0?(k+1)+' / '+S.length:'';$('bar').style.width=k>=0?((k+1)/S.length*100)+'%':'0';
 if(k>=0&&$('click').checked)shutter();}
function sceneAt(t){if(t>=AMEN-LEAD)return S.length;let k=-1;for(let j=0;j<S.length;j++)if(t>=BEAT[j]-LEAD)k=j;return k;}
function tick(){const t=A.currentTime,k=sceneAt(t);if(k!==cur)show(k);
 if(t>=FADE_FROM){const v=Math.max(0,1-(t-FADE_FROM)/(FADE_TO-FADE_FROM));A.volume=v;if(v<=0)A.pause();}else A.volume=1;
 raf=requestAnimationFrame(tick);}
function seekScene(k){k=Math.max(0,Math.min(S.length-1,k));A.currentTime=BEAT[k]-LEAD+0.01;}
function pause(){if(A.paused){A.play();$('paused').style.display='none'}else{A.pause();$('paused').style.display='block'}}
function start(){$('menu').style.display='none';cur=-99;A.currentTime=0;A.volume=1;A.play().catch(()=>{});cancelAnimationFrame(raf);tick();}
function menu(){A.pause();cancelAnimationFrame(raf);$('menu').style.display='flex';}
$('go').onclick=start;
addEventListener('keydown',e=>{if($('menu').style.display!=='none'){if(e.key==='Enter'&&!$('go').disabled)start();return}
 if(e.key===' '){e.preventDefault();pause()}else if(e.key==='ArrowRight')seekScene(cur+1);else if(e.key==='ArrowLeft')seekScene(cur-1);
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(e.key==='m'||e.key==='M')A.muted=!A.muted;else if(e.key==='Escape')menu();});
</script></body></html>
