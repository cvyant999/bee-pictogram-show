<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEE 픽토그램 쇼</title>
<style>
:root{--ink:#1f2a6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;overflow:hidden;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pic{width:min(78vh,90vw);height:min(78vh,90vw);object-fit:contain}
.pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{0%{transform:scale(0) rotate(-18deg)}70%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
#title{font-size:5vh;font-weight:800;margin-top:1.5vh;min-height:6vh;text-align:center}
#num{position:fixed;right:3vh;bottom:2vh;font-size:3vh;font-weight:800;opacity:.5}
#bar{position:fixed;left:0;bottom:0;height:.8vh;background:var(--ink);width:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:var(--ink);color:#fff;text-align:center;z-index:5;padding:4vh}
#menu h1{font-size:7vh}#menu p{opacity:.8;font-size:2.2vh;line-height:1.7}
#menu button{font-size:4vh;font-weight:800;padding:2vh 7vh;border:0;border-radius:2vh;background:#fff;color:var(--ink);cursor:pointer}
#menu label{font-size:2.2vh}#menu input{width:8vh;font-size:2.2vh;text-align:center}
#paused{position:fixed;top:2vh;right:3vh;font-size:3vh;font-weight:800;display:none}
</style></head><body>
<div id="stage"><img id="pic" alt=""><div id="title"></div></div>
<div id="num"></div><div id="bar"></div><div id="flash"></div><div id="paused">⏸ 일시정지</div>
<div id="menu">
  <h1>BEE 픽토그램 쇼</h1>
  <p>요한복음: 일곱 표징 · '나는 ~이다' · 십자가 · 내 양을 먹이라<br><span id="info"></span></p>
  <label>장면당 초 <input id="sec" type="number" min="4" max="30" step="0.5"> (기본: 음악 길이에 맞춤)</label>
  <button id="go">▶ 시작</button>
  <p>스페이스 = 일시정지 · → 다음 · ← 이전 · F = 전체화면 · M = 음소거 · Esc = 처음으로</p>
</div>
<audio id="bgm" src="bgm.mp3" preload="auto"></audio>
<script>
const S=[{"id": "01a", "t": "물이 포도주로 (1)"}, {"id": "01b", "t": "물이 포도주로 (2)"}, {"id": "02a", "t": "왕의 신하의 아들 (1)"}, {"id": "02b", "t": "왕의 신하의 아들 (2)"}, {"id": "03a", "t": "베데스다 연못 (1)"}, {"id": "03b", "t": "베데스다 연못 (2)"}, {"id": "04a", "t": "오병이어 (1)"}, {"id": "04b", "t": "오병이어 (2)"}, {"id": "05a", "t": "물 위를 걸으심 (1)"}, {"id": "05b", "t": "물 위를 걸으심 (2)"}, {"id": "06a", "t": "날 때부터 맹인 된 자 (1)"}, {"id": "06b", "t": "날 때부터 맹인 된 자 (2)"}, {"id": "07a", "t": "나사로를 살리심 (1)"}, {"id": "07b", "t": "나사로를 살리심 (2)"}, {"id": "08", "t": "나는 생명의 떡이다"}, {"id": "09", "t": "나는 세상의 빛이다"}, {"id": "10a", "t": "나는 양의 문이다 (1)"}, {"id": "10b", "t": "나는 양의 문이다 (2)"}, {"id": "11", "t": "나는 선한 목자다"}, {"id": "12a", "t": "나는 부활이요 생명이다 (1)"}, {"id": "12b", "t": "나는 부활이요 생명이다 (2)"}, {"id": "13", "t": "나는 길이요 진리요 생명이니"}, {"id": "14", "t": "나는 참포도나무다"}, {"id": "15", "t": "십자가"}, {"id": "16a", "t": "내 양을 먹이라 (1)"}, {"id": "16b", "t": "내 양을 먹이라 (2)"}];
const $=id=>document.getElementById(id), A=$('bgm');
S.forEach(s=>{const i=new Image();i.src='p/'+s.id+'.jpg'});
let i=-1,timer=null,per=10.8,paused=false,t0=0,left=0,ctx=null;
function shutter(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const n=ctx.sampleRate*.09,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/n,3);const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=.9;s.buffer=b;s.connect(g).connect(ctx.destination);s.start();}catch(e){}
 const f=$('flash');f.style.transition='none';f.style.opacity=.85;requestAnimationFrame(()=>{f.style.transition='opacity .5s';f.style.opacity=0});}
function show(k){if(k<0)k=0;if(k>=S.length){end();return}i=k;const p=$('pic');p.classList.remove('pop');void p.offsetWidth;p.src='p/'+S[i].id+'.jpg';p.classList.add('pop');
 $('title').textContent=S[i].t;$('num').textContent=(i+1)+' / '+S.length;$('bar').style.width=((i+1)/S.length*100)+'%';shutter();schedule(per*1000);}
function schedule(ms){clearTimeout(timer);left=ms;t0=performance.now();timer=setTimeout(()=>show(i+1),ms);}
function pause(){if(paused){paused=false;$('paused').style.display='none';A.play();schedule(left);}else{paused=true;$('paused').style.display='block';A.pause();clearTimeout(timer);left-=performance.now()-t0;}}
function end(){clearTimeout(timer);$('title').textContent='아멘 🙏';let v=1;const fade=setInterval(()=>{v-=.05;A.volume=Math.max(v,0);if(v<=0){clearInterval(fade);A.pause();}},150);}
function start(){const v=parseFloat($('sec').value);per=v>0?v:per;$('menu').style.display='none';A.currentTime=0;A.volume=1;A.play().catch(()=>{});paused=false;show(0);}
function menu(){clearTimeout(timer);A.pause();$('menu').style.display='flex';}
A.addEventListener('loadedmetadata',()=>{per=Math.round(A.duration/S.length*10)/10;$('sec').value=per;$('info').textContent=S.length+'장면 · 음악 '+Math.floor(A.duration/60)+':'+String(Math.round(A.duration%60)).padStart(2,'0');});
$('sec').value=per;$('go').onclick=start;
addEventListener('keydown',e=>{if($('menu').style.display!=='none'){if(e.key==='Enter')start();return}
 if(e.key===' '){e.preventDefault();pause()}else if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(e.key==='m'||e.key==='M')A.muted=!A.muted;else if(e.key==='Escape')menu();});
</script></body></html>
